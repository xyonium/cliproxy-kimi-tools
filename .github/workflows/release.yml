name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-24.04,       ext: so }
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04-arm,   ext: so }
          - { goos: darwin,  goarch: amd64, runner: macos-15-intel,     ext: dylib }
          - { goos: darwin,  goarch: arm64, runner: macos-15,           ext: dylib }
          - { goos: windows, goarch: amd64, runner: windows-2025,       ext: dll }
          # windows/arm64 needs an ARM64-cross C toolchain (llvm-mingw); the
          # Go windows-11-arm runner image lacks one, so cgo c-shared fails
          # to assemble (gcc_arm64.S). Add back once you install llvm-mingw.

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./...

      - name: Build plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.goos }}/${{ matrix.goarch }}"
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -buildmode=c-shared -o "dist/${{ matrix.goos }}/${{ matrix.goarch }}/kimi-tools.${{ matrix.ext }}" .

      - name: Zip plugin asset
        shell: bash
        env:
          GOOS_: ${{ matrix.goos }}
          GOARCH_: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          cd "dist/${GOOS_}/${GOARCH_}"
          # bsdtar's -a flag auto-selects zip when the output suffix is .zip;
          # available on all GitHub-hosted runners (incl. windows-2025).
          mkdir -p _pkg
          cp "kimi-tools.${EXT}" "_pkg/kimi-tools.${EXT}"
          tar -a -c -f "../../kimi-tools_${VER}_${GOOS_}_${GOARCH_}.zip" -C _pkg "kimi-tools.${EXT}"
          ls -la "../.."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        env:
          GOOS_: ${{ matrix.goos }}
          GOARCH_: ${{ matrix.goarch }}
        with:
          name: kimi-tools_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          path: dist/kimi-tools_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          for f in artifacts/*/*.zip; do
            cp -v "$f" release/
          done
          cd release
          sha256sum *.zip > checksums.txt
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
